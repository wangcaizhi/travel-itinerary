<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>西安周末行程</title>
  <style>
    :root {
      --ink: #1f2326;
      --muted: #667078;
      --paper: #f7f1e6;
      --panel: #fffdf8;
      --line: #ded2bd;
      --terracotta: #a94f2a;
      --jade: #2c6657;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(169, 79, 42, 0.12), transparent 32%),
        linear-gradient(225deg, rgba(44, 102, 87, 0.12), transparent 38%),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    a.card {
      display: block;
      min-height: 210px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 14px 40px rgba(31, 35, 38, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    a.card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 50px rgba(31, 35, 38, 0.13);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 18px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eee6d8;
      color: var(--jade);
      font-size: 13px;
      font-weight: 800;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .primary .tag {
      color: #fff;
      background: var(--terracotta);
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      main { padding: 36px 0; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>西安周末行程</h1>
    <p class="lead">深圳出发，5 月 30 日到西安玩一个周末，6 月 1 日周一下午返程。下面保留两份页面，方便按需要打开或分享。</p>

    <div class="cards">
      <a class="card primary" href="./weekend-2026-05-30.html">
        <span class="tag">推荐版</span>
        <h2>3 天 2 晚行程 · 含路线图</h2>
        <p>新版页面，包含总览、每日时间线、路线图、预约清单、交通和预算。</p>
      </a>

      <a class="card" href="./classic.html">
        <span class="tag">备份版</span>
        <h2>西安周末漫游</h2>
        <p>早先版本，包含更偏攻略感的路线、提醒和预算说明。</p>
      </a>
    </div>

    <footer>GitHub Pages 静态页面入口。</footer>
  </main>
</body>
</html>
